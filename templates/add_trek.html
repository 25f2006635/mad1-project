<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/main.css">
    <title>Add New Trek</title>
</head>

<body>
    <div class="container">
        <div class="center">
            <h1>^-^ Trekkmaster welcomes you ^-^ !</h1>
        </div>
        <div class="form_style" ; style="width: 80%;">
            <form action="{{ url_for('add_trek') }}" method="POST">
                <h3 class="heading">Add New Trek</h3>
                <div style="display: flex; padding-top: 18px;">
                    <div class="form_style" ; style="height: 350px;">
                        <table class="center">
                            <tr>
                                <td> <label for="Trek Name">Trek Name :</label></td>
                                <td><input type="text" name="trek_name"></td>
                            </tr>
                            <tr>
                                <td> <label for="Location">Location :</label></td>
                                <td><input type="text" name="locn"></td>
                            </tr>
                            <tr>
                                <td><label>Difficulty :</label></td>
                                <td>
                                    <select name="diff">
                                        <option value="" disabled selected>--Select--</option>
                                        <option value="0">Easy</option>
                                        <option value="1">Moderate</option>
                                        <option value="2">Hard</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td> <label for="Duration">Duration (Days) :</label></td>
                                <td><input type="number" name="durn"></td>
                            </tr>
                            <tr>
                                <td> <label for="Available Slots">Available Slots :</label></td>
                                <td><input type="number" name="av_slots"></td>
                            </tr>
                        </table>
                    </div>
                    <div class="form_style" ; style="height: 350px;">
                        <table class="center">
                            <tr>
                                <td> <label for="Start Date">Start Date :</label></td>
                                <td><input type="date" name="st_date"></td>
                            </tr>
                            <tr>
                                <td> <label for="End Date">End Date :</label></td>
                                <td><input type="date" name="en_date"></td>
                            </tr>
                            <tr>
                                <td><label>Assign Staff :</label></td>
                                <td>
                                    <select name="staff_id">
                                        <option value=" " disabled selected>--Select Staff--</option>
                                        {% for staff in staff_list %}
                                        <option value="{{ staff.staff_id }}">{{ staff.full_name }}</option>
                                        {% endfor %}
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><label>Status :</label></td>
                                <td>
                                    <select name="status">
                                        <option value="" disabled selected>--Select Status--</option>
                                        <option value="0">Pending</option>
                                        <option value="1">Open</option>
                                        <option value="2">Closed</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><label>Description: </label></td>
                                <td><textarea name="desn" id="add" cols="20" rows="5"></textarea></td>
                            </tr>
                            <tr>
                                <td>
                                <td><a href="{{ url_for('manage_treks') }}" class="button"><button
                                            type="button">Cancel</button></a></td>
                                </td>
                                <td><button type="submit">Save</button></td>
                            </tr>
                        </table>
                    </div>
                </div>

            </form>
        </div>
        <div class="center">
            <h5>&copy; copyrights reserved to Trekkmaster, 2026</h5>
        </div>
    </div>
</body>

</html>
