

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/main.css">
    <title>Register</title>
</head>
<body>
<div class="container">
    <div class="center"><h1>^-^ Trekkmaster welcomes you ^-^ !</h1></div>
    <div class="form_style">
        <form action="/signup" method="POST">
        <h3 class="heading">Sign Up Here</h3>
        <table class="center">
            <tr><td><label>User Type: </label></td>
            <td> 
               <select name="utype">
                  <option value="None" disabled selected>Select User Type</option>
                  <option value="1">Trek Staff</option>
                  <option value="2">User(Trekker)</option>

               </select>
            </td>
            <tr><br>
        <tr><td><label>Full Name: </label> </td><td><input type="text" name = "fname"></td></tr>
        <tr><td><label>Email ID: </label></td><td> <input type="email" name = "emailid"></td></tr>
        <tr><td><label>Password: </label></td><td><input type="password" name = "pwd"></td></tr>
        <tr><td><label>Address: </label></td><td><textarea name="address" id="add" cols="20" rows="5"></textarea></td></tr>
        <tr><td><label>Phone No: </label></td><td><input type="number" name = "phno"></td></tr>
        <tr><td><input type="submit" value="Signup"></td>
            <td><a href="javascript:history.back()">Login</a></td></tr>
        </table>
        <h6>{{error}}</h6>
        </form>
    </div>
    <div class="center">
        <h5>&copy; copyrights reserved to Trekkmaster, 2026</h5>
    </div>
</div>
</body>
</html>
